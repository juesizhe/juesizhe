name: 发布命题卡到 GitHub Pages

# 把 cards/ 目录发布为静态站点 —— 每张命题卡一个 URL，
# 看到它的人可以直接点进去推翻它。整个流程不调用任何大模型。

on:
  push:
    branches: [main]
    paths: ["cards/**", ".github/workflows/pages.yml", ".github/scripts/build_pages_site.py"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建站点
        run: python .github/scripts/build_pages_site.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
