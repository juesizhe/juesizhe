name: 贡献自动裁决（零 token）

# 机器裁决，不调用任何大模型：字段完整性 / 跨域性 / 笼统词 / 重复 /
# 已否证表述 / 伪证黑名单，全部由 scripts/contrib_check.py 确定性判定。
# 目的：让贡献者在 30 秒内拿到即时反馈——即时反馈才是留存的关键。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 组装待检文本
        id: build
        run: |
          python - <<'PY' > checked.md
          import json, os
          issue = json.loads(os.environ['ISSUE'])
          print(issue['title'])
          print()
          print(issue['body'] or '')
          print()
          print('labels:' + ','.join(l['name'] for l in issue.get('labels', [])))
          PY
        env:
          ISSUE: ${{ toJson(github.event.issue) }}

      - name: 机判（允许失败以便输出结论）
        id: check
        continue-on-error: true
        run: |
          set +e
          python scripts/contrib_check.py checked.md --json > result.json
          echo "exit=$?" >> $GITHUB_OUTPUT
          cat result.json

      - name: 回帖结论
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let res;
            try { res = JSON.parse(fs.readFileSync('result.json','utf8')); }
            catch (e) { res = { passed: false, domains: [], issues: [{level:'驳回', msg:'机判执行失败'}] }; }
            const passed = res.passed;
            const lines = [];
            lines.push(passed ? '### ✔ 已通过初检' : '### ✘ 暂未通过初检');
            lines.push('');
            lines.push('**命中源域**：' + (res.domains.length ? res.domains.join('、') : '无'));
            lines.push('');
            if (res.issues.length) {
              lines.push('**机判结果**');
              for (const i of res.issues) lines.push(`- [${i.level}] ${i.msg}`);
            } else {
              lines.push('**机判结果**：无问题项。');
            }
            lines.push('');
            if (passed) {
              lines.push('这条已可用，等待 maintainer 并入语料库 / 进入下一轮推演。');
              lines.push('被引用时会在采用出处里 @ 你 —— 你的这一味会真的改变下一次输出。');
            } else {
              lines.push('修正上面标「驳回」的项后编辑本 Issue，会自动重新判定。绝大多数不通过只需两处改动：**补具体出处** + **再换一个不同源**。');
            }
            lines.push('');
            lines.push('<sub>本裁决由 `scripts/contrib_check.py` 确定性执行，未调用任何生成式模型。</sub>');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });
