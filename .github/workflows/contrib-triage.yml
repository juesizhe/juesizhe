name: 贡献自动裁决（零 token）

# 机器裁决，不调用任何大模型：字段完整性 / 跨域性 / 笼统词 / 重复 /
# 已否证表述 / 伪证黑名单，全部由 scripts/contrib_check.py 确定性判定。
# 目的：让贡献者在 30 秒内拿到即时反馈——即时反馈才是留存的关键。

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 单一 Node 步骤完成「组装文本 → 机判 → 回帖」：
      # 避免 shell 插值导致的脚本注入，也避免多行环境变量的兼容问题。
      - name: 机判并回帖
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const cp = require('child_process');
            const issue = context.payload.issue;

            const labels = (issue.labels || []).map(l => l.name).join(',');
            const text = [issue.title, '', issue.body || '', '', 'labels:' + labels].join('\n');
            fs.writeFileSync('checked.md', text, 'utf8');

            let res;
            try {
              const out = cp.execFileSync(
                'python3', ['scripts/contrib_check.py', 'checked.md', '--json'],
                { encoding: 'utf8' }
              );
              res = JSON.parse(out);
            } catch (e) {
              // 退出码 1 = 机检未通过；其他异常按失败处理，输出里也尝试取结论
              const stdout = (e.stdout || '').toString();
              try { res = JSON.parse(stdout); }
              catch (e2) { res = { passed: false, domains: [], issues: [{ level: '驳回', msg: '机判脚本异常' }] }; }
            }

            const lines = [];
            lines.push(res.passed ? '### ✔ 已通过初检' : '### ✘ 暂未通过初检');
            lines.push('');
            lines.push('**命中源域**：' + ((res.domains || []).length ? res.domains.join('、') : '无'));
            lines.push('');
            if (res.issues && res.issues.length) {
              lines.push('**机判结果**');
              for (const i of res.issues) lines.push(`- [${i.level}] ${i.msg}`);
            } else {
              lines.push('**机判结果**：无问题项。');
            }
            lines.push('');
            if (res.passed) {
              lines.push('这条已可用，等待 maintainer 并入语料库 / 进入下一轮推演。');
              lines.push('被引用时会在采用出处里署名你 —— 你的这一味会真的改变下一次输出。');
            } else {
              lines.push('绝大多数不通过只需两处改动：**补具体出处** + **再换一个不同源**。修改后直接编辑本 Issue，会自动重新判定。');
            }
            lines.push('');
            lines.push('<sub>本裁决由 `scripts/contrib_check.py` 确定性执行，未调用任何生成式模型。</sub>');

            await github.rest.issues.createComment({
              issue_number: issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n')
            });
